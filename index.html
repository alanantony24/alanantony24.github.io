<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alan Antony | Portfolio</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: white;
      }
      .card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 18px;
        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin-bottom: 1.5rem;
        color: #dbeafe;
      }
      a {
        display: inline-block;
        background: white;
        color: #0f172a;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Alan Antony</h1>
      <p>Personal portfolio and WAD2 coursework site.</p>
    </div>
  </body>
</html>
